stream_writer:
  block_size_limit: 104857600
  codec: zstd

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

compactor:
  ring:
    kvstore:
      store: inmemory
  compaction:
    compact_shared_blocks: true

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
